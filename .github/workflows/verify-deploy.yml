name: Verify Deployment

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify VPS Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== 1. Check container status ==="
            docker ps -a | grep reverse-proxy

            echo ""
            echo "=== 2. Check frontend/dist inside container ==="
            docker exec reverse-proxy ls -la /app/frontend/dist/ 2>/dev/null || echo "Directory not found or container not running"

            echo ""
            echo "=== 3. Check index.html exists ==="
            docker exec reverse-proxy ls -la /app/frontend/dist/index.html 2>/dev/null || echo "index.html not found"

            echo ""
            echo "=== 4. Check last deploy time ==="
            docker inspect reverse-proxy --format '{{.Created}}' 2>/dev/null || echo "Container not found"

            echo ""
            echo "=== 5. Check container logs (last 20 lines) ==="
            docker logs reverse-proxy --tail 20 2>/dev/null || echo "No logs"

            echo ""
            echo "=== 6. Force rebuild and recreate ==="
            cd /home/carlos/reverse-proxy
            git pull origin main
            docker compose build --no-cache
            docker compose up -d --force-recreate

            echo ""
            echo "=== 7. Verify after rebuild ==="
            sleep 5
            docker ps -a | grep reverse-proxy
            docker exec reverse-proxy ls -la /app/frontend/dist/index.html 2>/dev/null && echo "index.html OK" || echo "index.html MISSING"