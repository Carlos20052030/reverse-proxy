name: Diagnose VPS 3

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose VPS 3
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== bookmarks-api-api-1 logs (last 100 lines) ==="
            docker logs bookmarks-api-api-1 --tail 100

            echo ""
            echo "=== webhook-dispatcher-dispatcher-1 logs (last 50 lines) ==="
            docker logs webhook-dispatcher-dispatcher-1 --tail 50

            echo ""
            echo "=== Check tenants table via bookmarks-api-db-1 ==="
            docker exec -i bookmarks-api-db-1 psql -U bookmarks -d webhook_dispatcher -c "SELECT host, target_url FROM tenants;"

            echo ""
            echo "=== Check api_keys table schema ==="
            docker exec -i bookmarks-api-db-1 psql -U bookmarks -d webhook_dispatcher -c "\d api_keys"

            echo ""
            echo "=== Check api_keys table data ==="
            docker exec -i bookmarks-api-db-1 psql -U bookmarks -d webhook_dispatcher -c "SELECT id, name, key_prefix, key_hash, created_at, revoked_at FROM api_keys;"

            echo ""
            echo "=== Test API key creation directly ==="
            curl -X POST http://localhost:8081/api-keys \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $(docker exec bookmarks-api-api-1 cat /tmp/test_token 2>/dev/null || echo 'no-token')" \
              -d '{"name": "test-key"}' \
              -v 2>&1 | head -50 || echo "curl failed"