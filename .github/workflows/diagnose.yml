name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose VPS
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Checking bookmarks-api logs ==="
            docker logs bookmarks-api-api-1 --tail 100 2>/dev/null || docker logs $(docker ps -qf "name=bookmarks-api") --tail 100 2>/dev/null || echo "Container not found"

            echo ""
            echo "=== Checking webhooks dispatcher logs ==="
            docker logs webhooks-dispatcher --tail 50 2>/dev/null || docker logs $(docker ps -qf "name=webhook") --tail 50 2>/dev/null || echo "Container not found"

            echo ""
            echo "=== Checking reverse-proxy logs ==="
            docker logs reverse-proxy --tail 50 2>/dev/null || echo "Container not found"

            echo ""
            echo "=== Checking DNS for webhooks.nuntix.com.br ==="
            dig +short webhooks.nuntix.com.br

            echo ""
            echo "=== Checking tenants table in database ==="
            docker exec -i $(docker ps -qf "name=postgres") psql -U bookmarks -d webhook_dispatcher -c "SELECT host, target_url FROM tenants;" 2>/dev/null || echo "Could not query tenants table"

            echo ""
            echo "=== Checking api_keys table schema ==="
            docker exec -i $(docker ps -qf "name=postgres") psql -U bookmarks -d webhook_dispatcher -c "\d api_keys" 2>/dev/null || echo "Could not query api_keys table"